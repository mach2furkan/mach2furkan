xt><g class="l7"><text x="24" y="238" fill="#3fb950" font-weight="700">furkan@c-uas<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan></text><text x="158.4" y="238" fill="#e6edf3" textLength="260.4" lengthAdjust="spacingAndGlyphs">classify --model rf-fingerprint</text><rect class="c7" x="158.4" y="222" width="268.8" height="22" fill="#0d1117"/></g><text class="l8" x="24" y="262" fill="#d2a8ff" textLength="512.4" lengthAdjust="spacingAndGlyphs">FHSS video/C2 link · confidence 97.3% · class: LOW-SLOW-SMALL</text><g class="l9"><text x="24" y="286" fill="#3fb950" font-weight="700">furkan@c-uas<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan></text><text x="158.4" y="286" fill="#e6edf3" textLength="310.8" lengthAdjust="spacingAndGlyphs">fuse --rf --radar --eoir --handoff c2</text><rect class="c9" x="158.4" y="270" width="319.2" height="22" fill="#0d1117"/></g><text class="l10" x="24" y="310" fill="#00F5FF" textLength="554.4" lengthAdjust="spacingAndGlyphs">[ ✓ ] TRACK UAS-01 CONFIRMED · operator alerted · mission: protect</text><g class="cur"><text x="24" y="334" fill="#3fb950" font-weight="700">furkan@c-uas<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan></text><rect class="blink" x="158.4" y="320" width="9" height="18" fill="#00F5FF"/></g>
